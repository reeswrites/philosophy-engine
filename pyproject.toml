[project]
name = "philosophy-engine"
version = "0.1.0"
description = "Generative philosophy engine, Phase 0: reconstruct, formalize, check (Z3) and compare philosophical arguments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "z3-solver>=5.3.0.0",
]

[project.scripts]
phil = "philengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["philengine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
