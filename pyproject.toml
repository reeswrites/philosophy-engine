[project]
name = "philosophy-engine"
version = "0.1.0"
description = "Generative philosophy engine, Phase 0: reconstruct, formalize, check (Z3) and compare philosophical arguments."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Rees Draminski"}]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "mesa>=3",
    "networkx>=3.7",
    "pydantic>=2.14.1",
    "z3-solver>=5.3.0.0",
]

[project.scripts]
phil = "philengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["philengine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# the 15 slowest tests are printed after every run; `-n auto` (pytest-xdist, dev group) spreads the suite over the
# CPUs, see CONTRIBUTING.md
addopts = "--durations=15"
